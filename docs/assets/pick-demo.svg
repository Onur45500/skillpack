<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-label="skillpack pick terminal demo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="880" height="520" rx="16" fill="url(#bg)"/>
  <rect x="12" y="12" width="856" height="36" rx="10" fill="#1f2937"/>
  <circle cx="36" cy="30" r="6" fill="#ef4444"/>
  <circle cx="56" cy="30" r="6" fill="#eab308"/>
  <circle cx="76" cy="30" r="6" fill="#22c55e"/>
  <text x="110" y="35" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">skillpack pick</text>

  <text x="36" y="84" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">$ npx @onur45500/skillpack pick</text>

  <text x="36" y="128" fill="#e5e7eb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700">Your primary router: Superpowers</text>

  <text x="36" y="160" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">You chose &quot;Barrel through&quot;, &quot;Solo&quot;, and &quot;Skips tests / rushes</text>
  <text x="36" y="178" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">code&quot; &#8212; Superpowers fits that profile directly.</text>

  <text x="36" y="218" fill="#e5e7eb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">Safe to cherry-pick alongside Superpowers:</text>
  <text x="36" y="246" fill="#4ade80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">&#10003; grill-me (Matt Pocock) &#8212; no collision, fills a requirements gap</text>
  <text x="36" y="268" fill="#4ade80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">&#10003; diagnose (Matt Pocock) &#8212; no collision</text>
  <text x="36" y="290" fill="#4ade80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">&#10003; eval-and-skill-routing (Agent Skills) &#8212; no collision</text>
  <text x="36" y="312" fill="#f87171" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">&#10007; test-driven-development &#8212; SKIP: flat-install name collision</text>

  <text x="36" y="352" fill="#e5e7eb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">Install snippets</text>
  <text x="36" y="378" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"># Primary &#8212; Claude Code</text>
  <text x="36" y="398" fill="#fde68a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">/plugin install superpowers@claude-plugins-official</text>
  <text x="36" y="424" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"># Primary &#8212; Cursor / Codex / other</text>
  <text x="36" y="444" fill="#fde68a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">npx skills add obra/superpowers</text>

  <text x="36" y="486" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">using bundled snapshot &#183; run skillpack map fetch --refresh for live data</text>
</svg>
